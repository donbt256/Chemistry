<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Library</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [
      ['\\(', '\\)'],
      ['$', '$']
    ],
    displayMath: [
      ['\\[', '\\]'],
      ['$$', '$$']
    ],
    processEscapes: true,
    processEnvironments: true
  },
  options: {
    skipHtmlTags: [
      'script',
      'noscript',
      'style',
      'textarea',
      'pre',
      'code'
    ]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>

<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f6f7f9, #111318);
  --panel: light-dark(#ffffff, #191c22);
  --panel-2: light-dark(#f0f2f5, #22262e);
  --text: light-dark(#20242b, #e7eaf0);
  --muted: light-dark(#69717d, #9ca5b3);
  --border: light-dark(#d9dde4, #303641);
  --accent: light-dark(#0969da, #58a6ff);
  --accent-bg: light-dark(#ddf4ff, #172b3d);
  --code-bg: light-dark(#f1f3f5, #1c2027);
  --shadow: light-dark(0 8px 30px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.25));
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
               sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--panel);
  padding: 22px 16px;
}

.brand {
  padding: 4px 10px 20px;
}

.brand h1 {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 650;
}

.brand p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .82rem;
}

.search {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 11px;
  outline: none;
  margin-bottom: 14px;
}

.search:focus {
  border-color: var(--accent);
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.file-item {
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 7px;
  padding: 8px 10px;
  background: transparent;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-item:hover {
  background: var(--panel-2);
}

.file-item.active {
  background: var(--accent-bg);
  color: var(--accent);
}

.main {
  min-width: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
}

.mobile-menu {
  display: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  padding: 7px 10px;
}

.current-file {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: .9rem;
}

.action {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  padding: 7px 11px;
  text-decoration: none;
  font-size: .85rem;
}

.action:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.content-wrap {
  width: min(100%, 1050px);
  margin: 0 auto;
  padding: 38px 34px 80px;
}

.content {
  min-width: 0;
}

.content h1,
.content h2,
.content h3,
.content h4 {
  line-height: 1.25;
  scroll-margin-top: 80px;
}

.content h1 {
  font-size: 2rem;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.content h2 {
  margin-top: 2em;
  font-size: 1.45rem;
}

.content h3 {
  margin-top: 1.6em;
  font-size: 1.15rem;
}

.content p,
.content li {
  line-height: 1.7;
}

.content a {
  color: var(--accent);
}

.content img {
  max-width: 100%;
  height: auto;
}

.content blockquote {
  margin: 1em 0;
  padding: .5em 1em;
  border-left: 4px solid var(--border);
  color: var(--muted);
}

.content table {
  width: 100%;
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
}

.content th,
.content td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: left;
}

.content th {
  background: var(--panel-2);
}

.content code {
  border-radius: 5px;
  background: var(--code-bg);
  padding: .15em .35em;
}

.content pre {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--code-bg);
  padding: 15px;
}

.content pre code {
  padding: 0;
  background: transparent;
}

.content hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 2em 0;
}

.toc {
  margin: 0 0 30px;
  padding: 15px 17px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
}

.toc-title {
  margin: 0 0 8px;
  font-size: .85rem;
  color: var(--muted);
}

.toc ul {
  margin: 0;
  padding-left: 18px;
}

.toc li {
  margin: 4px 0;
}

.status {
  min-height: 50vh;
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
  padding: 30px;
}

.error {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  padding: 20px;
}

.error h2 {
  margin-top: 0;
}

.mobile-overlay {
  display: none;
}

mjx-container {
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;
}

@media (max-width: 800px) {
  .app {
    display: block;
  }

  .sidebar {
    position: fixed;
    z-index: 30;
    left: 0;
    top: 0;
    width: min(86vw, 320px);
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--shadow);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .mobile-menu {
    display: block;
  }

  .mobile-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.4);
  }

  .mobile-overlay.visible {
    display: block;
  }

  .topbar {
    padding: 10px 14px;
  }

  .content-wrap {
    padding: 26px 18px 60px;
  }

  .action {
    display: none;
  }
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1 id="site-title">Markdown Library</h1>
      <p>Notes from GitHub</p>
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search notes..."
      aria-label="Search notes"
    >

    <nav id="file-list" class="file-list" aria-label="Markdown files"></nav>
  </aside>

  <div id="mobile-overlay" class="mobile-overlay"></div>

  <main class="main">
    <header class="topbar">
      <button id="mobile-menu" class="mobile-menu" type="button">
        Menu
      </button>

      <div id="current-file" class="current-file">
        Markdown Library
      </div>

      <a
        id="edit-button"
        class="action"
        href="#"
        target="_blank"
        rel="noopener"
      >
        Edit on GitHub
      </a>
    </header>

    <div class="content-wrap">
      <div id="status" class="status">
        <div>Starting…</div>
      </div>

      <article id="content" class="content" hidden></article>
    </div>
  </main>
</div>

<script>
const CONFIG = {
  owner: "donbt256",
  repo: "Chemistry",
  branch: "main",
  notesRoot: "",
  siteTitle: "Markdown Library"
};

const API_BASE =
  `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`;

const RAW_BASE =
  `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/`;

const GITHUB_BASE =
  `https://github.com/${CONFIG.owner}/${CONFIG.repo}`;

const state = {
  files: [],
  filteredFiles: [],
  currentPath: null
};

const $ = id => document.getElementById(id);

$("site-title").textContent = CONFIG.siteTitle;
document.title = CONFIG.siteTitle;

function normalizePath(path) {
  return path.replace(/^\/+|\/+$/g, "");
}

function inNotesRoot(path) {
  const root = normalizePath(CONFIG.notesRoot);

  if (!root) {
    return true;
  }

  return path === root || path.startsWith(root + "/");
}

function getHashPath() {
  const hash = decodeURIComponent(location.hash.slice(1));

  if (!hash) {
    return null;
  }

  return normalizePath(hash);
}

function setHashPath(path) {
  location.hash = encodeURIComponent(path);
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value;
  return div.innerHTML;
}

function makeId(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, "-");
}

function showStatus(message, isError = false) {
  $("status").hidden = false;

  if (isError) {
    $("status").innerHTML = `
      <div class="error">
        <h2>Unable to load</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  } else {
    $("status").innerHTML = `<div>${escapeHtml(message)}</div>`;
  }

  $("content").hidden = true;
}

function showContent() {
  $("status").hidden = true;
  $("content").hidden = false;
}

async function githubFetch(url) {
  const response = await fetch(url, {
    headers: {
      Accept: "application/vnd.github+json"
    }
  });

  if (!response.ok) {
    let detail = "";

    try {
      const data = await response.json();
      detail = data.message || "";
    } catch (_) {}

    throw new Error(
      `GitHub returned ${response.status}${detail ? `: ${detail}` : ""}`
    );
  }

  return response.json();
}

async function loadFileList() {
  const url =
    `${API_BASE}/git/trees/${encodeURIComponent(CONFIG.branch)}` +
    `?recursive=1`;

  const data = await githubFetch(url);

  if (data.truncated) {
    console.warn("GitHub tree response was truncated.");
  }

  state.files = (data.tree || [])
    .filter(item =>
      item.type === "blob" &&
      /\.md$/i.test(item.path) &&
      inNotesRoot(item.path)
    )
    .map(item => item.path)
    .sort((a, b) =>
      a.localeCompare(b, undefined, {
        numeric: true,
        sensitivity: "base"
      })
    );

  renderFileList();

  if (!state.files.length) {
    throw new Error(
      "No Markdown files were found in the configured repository path."
    );
  }
}

function renderFileList() {
  const list = $("file-list");
  list.innerHTML = "";

  for (const path of state.filteredFiles) {
    const button = document.createElement("button");

    button.className = "file-item";
    button.type = "button";
    button.textContent = path;
    button.title = path;

    if (path === state.currentPath) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      setHashPath(path);
      closeMobileMenu();
    });

    list.appendChild(button);
  }

  if (!state.filteredFiles.length) {
    const empty = document.createElement("div");
    empty.style.padding = "10px";
    empty.style.color = "var(--muted)";
    empty.textContent = "No matching notes.";
    list.appendChild(empty);
  }
}

function filterFiles() {
  const query = $("search").value.trim().toLowerCase();

  state.filteredFiles = query
    ? state.files.filter(path => path.toLowerCase().includes(query))
    : [...state.files];

  renderFileList();
}

function addHeadingIds(container) {
  const used = new Map();

  container.querySelectorAll("h1, h2, h3, h4, h5, h6")
    .forEach(heading => {
      const base = makeId(heading.textContent) || "section";
      const count = used.get(base) || 0;
      used.set(base, count + 1);

      heading.id = count ? `${base}-${count + 1}` : base;
    });
}

function buildToc(container) {
  const headings = [...container.querySelectorAll("h2, h3")];

  if (!headings.length) {
    return;
  }

  const toc = document.createElement("aside");
  toc.className = "toc";

  const title = document.createElement("div");
  title.className = "toc-title";
  title.textContent = "On this page";

  const list = document.createElement("ul");

  headings.forEach(heading => {
    const item = document.createElement("li");
    const link = document.createElement("a");

    link.href = `#${encodeURIComponent(state.currentPath)}:${heading.id}`;
    link.textContent = heading.textContent;

    link.addEventListener("click", event => {
      event.preventDefault();
      history.replaceState(
        null,
        "",
        `#${encodeURIComponent(state.currentPath)}:${heading.id}`
      );
      heading.scrollIntoView({ behavior: "smooth" });
    });

    item.appendChild(link);
    list.appendChild(item);
  });

  toc.appendChild(title);
  toc.appendChild(list);

  container.prepend(toc);
}

function rewriteLinks(container, currentPath) {
  const currentDirectory = currentPath.includes("/")
    ? currentPath.slice(0, currentPath.lastIndexOf("/") + 1)
    : "";

  container.querySelectorAll("a[href]").forEach(link => {
    const href = link.getAttribute("href");

    if (!href) {
      return;
    }

    if (
      href.startsWith("#") ||
      href.startsWith("http://") ||
      href.startsWith("https://") ||
      href.startsWith("mailto:") ||
      href.startsWith("tel:") ||
      href.startsWith("data:")
    ) {
      return;
    }

    const [rawPath, fragment] = href.split("#");

    if (!/\.md$/i.test(rawPath)) {
      return;
    }

    const resolved = normalizePath(
      currentDirectory + rawPath
    );

    if (state.files.includes(resolved)) {
      link.href =
        `#${encodeURIComponent(resolved)}` +
        (fragment ? `:${encodeURIComponent(fragment)}` : "");
    }
  });
}

function resolveImages(container, currentPath) {
  const currentDirectory = currentPath.includes("/")
    ? currentPath.slice(0, currentPath.lastIndexOf("/") + 1)
    : "";

  container.querySelectorAll("img[src]").forEach(img => {
    const src = img.getAttribute("src");

    if (!src) {
      return;
    }

    if (
      src.startsWith("http://") ||
      src.startsWith("https://") ||
      src.startsWith("data:") ||
      src.startsWith("blob:")
    ) {
      return;
    }

    const resolved = normalizePath(currentDirectory + src);
    img.src = RAW_BASE + resolved;
  });
}

async function typesetMath() {
  if (
    window.MathJax &&
    typeof window.MathJax.typesetPromise === "function"
  ) {
    try {
      await window.MathJax.typesetPromise([$(
        "content"
      )]);
    } catch (error) {
      console.warn("MathJax typesetting failed:", error);
    }
  }
}

async function renderMarkdown(markdown, path) {
  const renderer = new marked.Renderer();

  renderer.code = function({ text, lang }) {
    const language = (lang || "").trim();

    let highlighted;

    if (language && hljs.getLanguage(language)) {
      try {
        highlighted = hljs.highlight(text, {
          language
        }).value;
      } catch (_) {
        highlighted = escapeHtml(text);
      }
    } else {
      highlighted = escapeHtml(text);
    }

    return `<pre><code class="hljs${language ? ` language-${escapeHtml(language)}` : ""}">${highlighted}</code></pre>`;
  };

  marked.setOptions({
    renderer,
    gfm: true,
    breaks: false
  });

  const rendered = marked.parse(markdown);

  $("content").innerHTML = DOMPurify.sanitize(rendered, {
    USE_PROFILES: {
      html: true
    }
  });

  rewriteLinks($("content"), path);
  resolveImages($("content"), path);
  addHeadingIds($("content"));
  buildToc($("content"));

  showContent();

  await typesetMath();

  $("current-file").textContent = path;
  $("edit-button").href =
    `${GITHUB_BASE}/edit/${encodeURIComponent(CONFIG.branch)}/${path}`;

  renderFileList();
}

async function loadMarkdown(path) {
  if (!state.files.includes(path)) {
    showStatus("That Markdown file does not exist in the repository.", true);
    return;
  }

  state.currentPath = path;
  renderFileList();
  showStatus("Loading…");

  try {
    const response = await fetch(
      RAW_BASE + path
    );

    if (!response.ok) {
      throw new Error(
        `Could not fetch ${path} (${response.status}).`
      );
    }

    const markdown = await response.text();

    await renderMarkdown(markdown, path);

    const fragment = getHashPath();

    if (fragment && fragment.includes(":")) {
      const headingId = decodeURIComponent(
        fragment.split(":").slice(1).join(":")
      );

      const heading = document.getElementById(headingId);

      if (heading) {
        requestAnimationFrame(() => {
          heading.scrollIntoView();
        });
      }
    } else {
      window.scrollTo(0, 0);
    }
  } catch (error) {
    console.error(error);
    showStatus(error.message || "Unknown error.", true);
  }
}

async function initialize() {
  showStatus("Loading notes…");

  try {
    await loadFileList();

    const path = getHashPath();

    if (path && state.files.includes(path)) {
      await loadMarkdown(path);
    } else {
      await loadMarkdown(state.files[0]);
    }
  } catch (error) {
    console.error(error);
    showStatus(
      error.message ||
      "Could not load the Markdown library.",
      true
    );
  }
}

function handleHashChange() {
  const raw = getHashPath();

  if (!raw) {
    if (state.files.length) {
      loadMarkdown(state.files[0]);
    }
    return;
  }

  const path = raw.split(":")[0];

  if (state.files.includes(path)) {
    loadMarkdown(path);
  }
}

function openMobileMenu() {
  $("sidebar").classList.add("open");
  $("mobile-overlay").classList.add("visible");
}

function closeMobileMenu() {
  $("sidebar").classList.remove("open");
  $("mobile-overlay").classList.remove("visible");
}

$("search").addEventListener("input", filterFiles);

$("mobile-menu").addEventListener("click", openMobileMenu);

$("mobile-overlay").addEventListener("click", closeMobileMenu);

window.addEventListener("hashchange", handleHashChange);

state.filteredFiles = [];
initialize();
</script>
</body>
</html>
