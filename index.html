<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown Library</title>

<!-- Markdown + sanitization + syntax highlighting, all loaded in the browser. -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
      media="(prefers-color-scheme: dark)">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
      media="(prefers-color-scheme: light)">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>

<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f6f7f9,#0d1117);
  --panel: light-dark(#fff,#161b22);
  --panel2: light-dark(#f0f2f5,#21262d);
  --text: light-dark(#1f2328,#e6edf3);
  --muted: light-dark(#656d76,#8b949e);
  --border: light-dark(#d0d7de,#30363d);
  --accent: light-dark(#0969da,#58a6ff);
  --hover: light-dark(#eef3f8,#1f2933);
  --code: light-dark(#f6f8fa,#0d1117);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
body { font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button,input { font:inherit; }
a { color:var(--accent); }

.app { display:grid; grid-template-columns:300px minmax(0,1fr); min-height:100vh; }
.sidebar {
  position:sticky; top:0; height:100vh; overflow:auto;
  background:var(--panel); border-right:1px solid var(--border);
  padding:18px 14px;
}
.brand { font-size:20px; font-weight:700; margin:0 8px 14px; }
.repo { color:var(--muted); font-size:12px; margin:-8px 8px 14px; overflow-wrap:anywhere; }
.search { width:100%; padding:9px 11px; border:1px solid var(--border);
  border-radius:8px; background:var(--panel2); color:var(--text); outline:none; }
.search:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent); }

.tree { margin-top:14px; }
.tree details { margin:1px 0; }
.tree summary {
  cursor:pointer; list-style:none; padding:5px 8px; border-radius:6px;
  user-select:none;
}
.tree summary::-webkit-details-marker { display:none; }
.tree summary:hover, .file:hover { background:var(--hover); }
.folder::before { content:"▸"; display:inline-block; width:18px; color:var(--muted); }
details[open] > summary .folder::before { transform:rotate(90deg); }
.file {
  display:block; padding:5px 8px 5px 26px; border-radius:6px;
  color:var(--text); text-decoration:none; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap;
}
.file.active { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); }
.empty { color:var(--muted); padding:8px; font-size:13px; }

.main { min-width:0; }
.topbar {
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
  min-height:58px; padding:9px 22px; background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.mobile-menu { display:none; }
.path { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.action {
  border:1px solid var(--border); background:var(--panel); color:var(--text);
  border-radius:7px; padding:7px 11px; text-decoration:none; cursor:pointer;
}
.action:hover { background:var(--hover); }
.content { max-width:920px; margin:0 auto; padding:42px 28px 80px; }
.article { min-width:0; }
.article h1,.article h2,.article h3,.article h4 { line-height:1.25; margin-top:1.5em; }
.article h1 { font-size:2.15rem; margin-top:0; }
.article h2 { font-size:1.55rem; }
.article h3 { font-size:1.25rem; }
.article img { max-width:100%; height:auto; border-radius:8px; }
.article pre { overflow:auto; background:var(--code); border:1px solid var(--border);
  border-radius:9px; padding:16px; }
.article code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.article :not(pre)>code { background:var(--panel2); border-radius:4px; padding:2px 5px; }
.article blockquote { margin-left:0; padding:4px 18px; border-left:4px solid var(--border); color:var(--muted); }
.article table { width:100%; border-collapse:collapse; display:block; overflow:auto; }
.article th,.article td { border:1px solid var(--border); padding:7px 10px; text-align:left; }
.article th { background:var(--panel2); }
.article hr { border:0; border-top:1px solid var(--border); margin:2em 0; }
.article a { overflow-wrap:anywhere; }

.toc {
  float:right; width:245px; margin:0 0 20px 30px; padding:12px;
  border:1px solid var(--border); border-radius:9px; background:var(--panel);
  font-size:13px;
}
.toc-title { font-weight:700; margin-bottom:5px; }
.toc ul { margin:0; padding-left:18px; }
.toc a { text-decoration:none; }

.status { color:var(--muted); }
.error {
  padding:16px; border:1px solid var(--border); border-radius:9px;
  background:var(--panel); white-space:pre-wrap;
}
.loading { color:var(--muted); }

@media(max-width:760px) {
  .app { display:block; }
  .sidebar {
    position:fixed; z-index:20; left:0; top:0; width:min(88vw,320px);
    transform:translateX(-105%); transition:transform .18s ease;
    box-shadow:8px 0 30px rgba(0,0,0,.25);
  }
  body.menu-open .sidebar { transform:translateX(0); }
  .mobile-menu { display:block; }
  .content { padding:30px 18px 60px; }
  .toc { float:none; width:auto; margin:0 0 24px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Markdown Library</div>
    <div class="repo" id="repoLabel">Loading repository…</div>
    <input class="search" id="search" type="search" placeholder="Search files…" autocomplete="off">
    <nav class="tree" id="tree"><div class="empty">Loading files…</div></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="action mobile-menu" id="menuBtn" type="button" aria-label="Open menu">☰</button>
      <div class="path" id="path">Loading…</div>
      <a class="action" id="editBtn" target="_blank" rel="noopener" hidden>Edit</a>
      <a class="action" id="githubBtn" target="_blank" rel="noopener">GitHub</a>
    </header>

    <section class="content">
      <article class="article" id="article">
        <div class="loading">Loading Markdown library…</div>
      </article>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  /*
    CONFIGURATION
    -------------
    If this page is hosted in a GitHub repository, the defaults below can
    usually be left alone. The page derives owner/repository/branch from
    the GitHub Pages URL.

    For a custom domain, or if you want to force a repository, set:
      const CONFIG = {
        owner: "YOUR_GITHUB_USERNAME",
        repo: "YOUR_REPOSITORY",
        branch: "main",
        notesRoot: "notes"
      };
  */
  const CONFIG = {
    owner: "donbt256",
    repo: "Chemistry",
    branch: "main",
    notesRoot: "",
    siteTitle: "Markdown Library"
  };

  const state = {
    files: [],
    filtered: [],
    current: null,
    config: null
  };

  const $ = id => document.getElementById(id);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  function githubConfig() {
    if (CONFIG.owner && CONFIG.repo) {
      return { owner: CONFIG.owner, repo: CONFIG.repo, branch: CONFIG.branch, root: CONFIG.notesRoot || "" };
    }

    const host = location.hostname;
    const parts = location.pathname.split("/").filter(Boolean);

    // github.io/user/repo/...
    if (host.endsWith(".github.io")) {
      const owner = host.split(".")[0];
      const repo = parts[0] || "";
      return { owner, repo, branch: CONFIG.branch, root: CONFIG.notesRoot || "" };
    }

    // If using a custom domain, set CONFIG.owner/repo above.
    throw new Error(
      "This page could not determine its GitHub repository automatically.\\n\\n" +
      "If you are using a custom domain, edit CONFIG at the top of index.html " +
      "and set owner and repo."
    );
  }

  async function githubApi(path) {
    const r = await fetch("https://api.github.com/repos/" +
      encodeURIComponent(state.config.owner) + "/" +
      encodeURIComponent(state.config.repo) + "/contents/" +
      path.split("/").map(encodeURIComponent).join("/") +
      "?ref=" + encodeURIComponent(state.config.branch), {
        headers: { "Accept":"application/vnd.github+json" }
      });
    if (!r.ok) {
      const body = await r.text().catch(() => "");
      throw new Error(`GitHub API returned ${r.status} ${r.statusText}\\n${body.slice(0,500)}`);
    }
    return r.json();
  }

  async function discoverFiles() {
    const root = state.config.root.replace(/^\/+|\/+$/g, "");
    const start = root ? await githubApi(root) : await githubApi("");
    const found = [];

    async function walk(entries) {
      for (const entry of entries) {
        if (entry.type === "file" && entry.name.toLowerCase().endsWith(".md")) {
          found.push({
            path: entry.path,
            name: entry.name,
            url: entry.html_url
          });
        } else if (entry.type === "dir") {
          const children = await githubApi(entry.path);
          await walk(children);
        }
      }
    }

    if (Array.isArray(start)) {
      await walk(start);
    } else {
      throw new Error("The configured notes directory could not be read.");
    }

    found.sort((a,b) => a.path.localeCompare(b.path, undefined, {numeric:true, sensitivity:"base"}));
    return found;
  }

  function treeNode(files) {
    const root = { dirs:new Map(), files:[] };

    for (const file of files) {
      const parts = file.path.split("/");
      let node = root;
      for (let i=0; i<parts.length-1; i++) {
        const part = parts[i];
        if (!node.dirs.has(part)) node.dirs.set(part, { dirs:new Map(), files:[] });
        node = node.dirs.get(part);
      }
      node.files.push(file);
    }

    function render(node, depth=0) {
      let out = "";
      for (const [name, child] of [...node.dirs.entries()].sort((a,b)=>a[0].localeCompare(b[0]))) {
        const childFiles = [...child.files];
        out += `<details ${depth === 0 ? "open" : ""}>
          <summary><span class="folder">${escapeHtml(name)}</span></summary>
          <div>${render(child, depth+1)}</div>
        </details>`;
      }
      for (const file of node.files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}))) {
        out += `<a class="file" data-path="${escapeHtml(file.path)}" href="#${encodeURIComponent(file.path)}">${escapeHtml(file.name.replace(/\\.md$/i,""))}</a>`;
      }
      return out;
    }
    return render(root);
  }

  function renderTree() {
    const files = state.filtered;
    $("tree").innerHTML = files.length ? treeNode(files) : `<div class="empty">No Markdown files found.</div>`;

    document.querySelectorAll(".file").forEach(a => {
      a.addEventListener("click", () => {
        document.body.classList.remove("menu-open");
      });
    });
    markActive();
  }

  function markActive() {
    document.querySelectorAll(".file").forEach(a => {
      a.classList.toggle("active", decodeURIComponent(location.hash.slice(1)) === a.dataset.path);
    });
  }

  function makeSlug(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]*>/g,"")
      .replace(/[^\w\s-]/g,"")
      .replace(/\s+/g,"-");
  }

  function buildToc() {
    const headings = [...$("article").querySelectorAll("h2,h3")];
    if (!headings.length) return;

    const used = new Set();
    const items = headings.map(h => {
      let slug = makeSlug(h.textContent) || "section";
      let base = slug, i = 2;
      while (used.has(slug)) slug = `${base}-${i++}`;
      used.add(slug);
      h.id = slug;
      return { level:Number(h.tagName.slice(1)), slug, text:h.textContent };
    });

    const toc = document.createElement("aside");
    toc.className = "toc";
    toc.innerHTML = `<div class="toc-title">On this page</div><ul>` +
      items.map(x => `<li><a href="#${escapeHtml(x.slug)}">${escapeHtml(x.text)}</a></li>`).join("") +
      `</ul>`;
    $("article").prepend(toc);
  }

  async function loadMarkdown(path) {
    const rawUrl = `https://raw.githubusercontent.com/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/${encodeURIComponent(state.config.branch)}/${path.split("/").map(encodeURIComponent).join("/")}`;

    $("article").innerHTML = `<div class="loading">Loading ${escapeHtml(path)}…</div>`;

    const response = await fetch(rawUrl);
    if (!response.ok) throw new Error(`Could not load ${path}: HTTP ${response.status}`);
    const markdown = await response.text();

    marked.setOptions({
      gfm: true,
      breaks: false
    });

    const unsafe = marked.parse(markdown);
    $("article").innerHTML = DOMPurify.sanitize(unsafe, {
      USE_PROFILES: { html:true }
    });

    // Rewrite relative links to other Markdown files into this site's routing.
    $("article").querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (!href || href.startsWith("#") || /^[a-z]+:/i.test(href)) return;

      const clean = href.split("#")[0].split("?")[0];
      const match = state.files.find(f =>
        f.path === clean ||
        f.path === path.split("/").slice(0,-1).concat(clean.split("/")).join("/")
      );

      if (match) {
        const anchor = href.includes("#") ? "#" + href.split("#").slice(1).join("#") : "";
        a.href = "#" + encodeURIComponent(match.path) + anchor;
      }
    });

    // Resolve relative image paths against the GitHub raw repository.
    $("article").querySelectorAll("img[src]").forEach(img => {
      const src = img.getAttribute("src");
      if (!src || /^[a-z]+:/i.test(src) || src.startsWith("//") || src.startsWith("#")) return;
      const base = path.split("/").slice(0,-1);
      const resolved = base.concat(src.split("/")).filter((p,i,a) => p !== ".");
      const stack = [];
      for (const part of resolved) {
        if (part === "..") stack.pop(); else stack.push(part);
      }
      img.src = `https://raw.githubusercontent.com/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/${encodeURIComponent(state.config.branch)}/${stack.map(encodeURIComponent).join("/")}`;
    });

    $("article").querySelectorAll("pre code").forEach(block => {
      if (window.hljs) hljs.highlightElement(block);
    });

    buildToc();

    const file = state.files.find(f => f.path === path);
    $("path").textContent = path;
    $("editBtn").hidden = !file;
    if (file) $("editBtn").href = file.url;
    state.current = path;
    markActive();

    document.title = `${path.split("/").pop().replace(/\\.md$/i,"")} · ${state.config.repo}`;
  }

  function showHome() {
    $("path").textContent = `${state.files.length} Markdown file${state.files.length === 1 ? "" : "s"}`;
    $("editBtn").hidden = true;
    document.title = state.config.siteTitle;

    $("article").innerHTML = `
      <h1>${escapeHtml(state.config.siteTitle)}</h1>
      <p class="status">A browser-rendered Markdown directory.</p>
      <p>Select a Markdown file from the directory.</p>
      <p class="status">${state.files.length} file${state.files.length === 1 ? "" : "s"} discovered in this repository.</p>
    `;
    markActive();
  }

  async function route() {
    const encoded = location.hash.slice(1);
    const hashPath = encoded ? decodeURIComponent(encoded.split("#")[0]) : "";
    if (!hashPath) {
      showHome();
      return;
    }

    const file = state.files.find(f => f.path === hashPath);
    if (!file) {
      $("article").innerHTML = `<div class="error">File not found in the discovered Markdown directory:\\n\\n${escapeHtml(hashPath)}</div>`;
      $("path").textContent = "Not found";
      return;
    }

    try {
      await loadMarkdown(file.path);
    } catch (err) {
      $("article").innerHTML = `<div class="error">${escapeHtml(err.message || String(err))}</div>`;
    }
  }

  function setupSearch() {
    $("search").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      state.filtered = q
        ? state.files.filter(f => f.path.toLowerCase().includes(q))
        : [...state.files];
      renderTree();
    });
  }

  async function init() {
    try {
      state.config = githubConfig();
      $("repoLabel").textContent = `${state.config.owner}/${state.config.repo}`;
      $("githubBtn").href = `https://github.com/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}`;

      state.files = await discoverFiles();
      state.filtered = [...state.files];
      renderTree();
      setupSearch();

      window.addEventListener("hashchange", route);
      $("menuBtn").addEventListener("click", () => document.body.classList.toggle("menu-open"));

      await route();
    } catch (err) {
      $("tree").innerHTML = "";
      $("article").innerHTML = `<div class="error">${escapeHtml(err.message || String(err))}</div>`;
      $("path").textContent = "Setup error";
    }
  }

  init();
})();
</script>
</body>
</html>
