<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310">
<title>Resonance in benzene, C₆H₆</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Resonance in benzene, C₆H₆</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">The ring shorthand represents delocalized inner electrons.</text><line x1="305.0" y1="127.5" x2="305.0" y2="202.5" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="287" y1="165" x2="298" y2="165" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><line x1="305.0" y1="202.5" x2="240.0" y2="240.0" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="240.0" y1="240.0" x2="175.0" y2="202.5" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="217" y1="206" x2="211" y2="216" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><line x1="175.0" y1="202.5" x2="175.0" y2="127.5" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="175.0" y1="127.5" x2="240.0" y2="90.0" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="217" y1="124" x2="211" y2="114" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><line x1="240.0" y1="90.0" x2="305.0" y2="127.5" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><text x="240" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">alternating bonds</text><text x="450" y="175" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#7c3aed" text-anchor="middle">↔</text><polygon points="590,105 645,137 645,193 590,225 535,193 535,137" fill="none" stroke="#1f2937" stroke-width="3"/><circle cx="590" cy="165" r="38" fill="none" stroke="#2563eb" stroke-width="3"/><text x="590" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">ring shorthand</text></svg>
