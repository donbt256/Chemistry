tica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">single bond</text><text x="155" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">Each F has 3 lone pairs</text><text x="450" y="105" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">O₂</text><text x="396" y="175" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><text x="504" y="175" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><line x1="422" y1="161.5" x2="478" y2="161.5" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/><line x1="422" y1="170.5" x2="478" y2="170.5" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/><circle cx="374" cy="145" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="382" cy="145" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="374" cy="199" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="382" cy="199" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="526" cy="145" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="534" cy="145" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="526" cy="199" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="534" cy="199" r="2.8" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="450" y="250" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">double bond</text><text x="450" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">Each O has 2 lone pairs</text><text x="745" y="105" font-family="Arial, Helvetica, sans-serif" font-size="24" font-wei