<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<title>Lewis bonding in F₂, O₂, and N₂</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
