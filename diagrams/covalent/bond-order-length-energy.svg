<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<title>Bond order, length, and dissociation energy</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Bond order, length, and dissociation energy</text><text x="175" y="105" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">C—C</text><line x1="123" y1="155.0" x2="227" y2="155.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="175" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Length: 154 pm</text><text x="175" y="247" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Energy: 346 kJ/mol</text><text x="450" y="105" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">C=C</text><line x1="398" y1="150.0" x2="502" y2="150.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="398" y1="160.0" x2="502" y2="160.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="450" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Length: 134 pm</text><text x="450" y="247" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Energy: 612 kJ/mol</text><text x="725" y="105" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">C≡C</text><line x1="673" y1="145.0" x2="777" y2="145.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="673" y1="155.0" x2="777" y2="155.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="673" y1="165.0" x2="777" y2="165.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="725" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Length: 120 pm</text><text x="725" y="247" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Energy: 835 kJ/mol</text><text x="450" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">Higher bond order → shorter bond and greater bond energy (in this comparison)</text></svg>
