<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
<title>Coordinate covalent bond: ammonium</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Coordinate covalent bond: ammonium</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">A simplified formation sketch based on the slide&#x27;s explanation.</text><text x="225" y="140" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">NH₃</text><text x="450" y="140" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">+</text><text x="565" y="140" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">H⁺</text><line x1="315" y1="150" x2="385" y2="150" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><polygon points="385,150 371,142 371,158" fill="#1f2937"/><text x="450" y="195" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">lone pair donated by N</text><line x1="625" y1="150" x2="695" y2="150" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><polygon points="695,150 681,142 681,158" fill="#1f2937"/><text x="770" y="140" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">NH₄⁺</text><text x="450" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Both electrons in the new N—H bond come from nitrogen.</text></svg>
