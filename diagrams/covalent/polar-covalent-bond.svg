<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310">
<title>Polar covalent bond: H—Cl</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Polar covalent bond: H—Cl</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">The shared electrons are attracted more strongly toward chlorine.</text><circle cx="300" cy="170" r="43" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/><text x="300" y="180.2" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">H</text><circle cx="570" cy="170" r="49" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="570" y="179.18" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2937" text-anchor="middle">Cl</text><line x1="350" y1="170" x2="515" y2="170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><text x="365" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">shared pair</text><text x="300" y="112" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">δ+</text><text x="570" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">δ−</text><line x1="370" y1="225" x2="505" y2="225" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><polygon points="505,225 488,215 488,235" fill="#2563eb"/><text x="438" y="258" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">bond dipole points toward the more electronegative atom</text></svg>
