<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<title>Resonance in ozone, O₃</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Resonance in ozone, O₃</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">Two valid Lewis contributors differ in the placement of the double bond.</text><text x="155" y="160" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><text x="230" y="160" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><text x="305" y="160" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><text x="595" y="160" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><text x="670" y="160" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><text x="745" y="160" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1f2937" text-anchor="middle">O</text><line x1="165" y1="145" x2="195" y2="145" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="165" y1="153" x2="195" y2="153" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="265" y1="149" x2="295" y2="149" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="605" y1="149" x2="635" y2="149" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="705" y1="145" x2="735" y2="145" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="705" y1="153" x2="735" y2="153" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="230" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">O=O—O</text><text x="670" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">O—O=O</text><text x="450" y="158" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#7c3aed" text-anchor="middle">↔</text><text x="450" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">The actual structure is described as a resonance hybrid—not as rapid switching.</text></svg>
