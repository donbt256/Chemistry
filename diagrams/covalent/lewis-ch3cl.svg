<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335">
<title>Worked Lewis-structure sketch: CH₃Cl</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Worked Lewis-structure sketch: CH₃Cl</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">Carbon forms four single bonds; chlorine has three lone pairs.</text><text x="450" y="155" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">C</text><line x1="450" y1="170" x2="450" y2="100" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="450" y="108" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2937" text-anchor="middle">H</text><line x1="450" y1="170" x2="365" y2="170" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="365" y="178" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2937" text-anchor="middle">H</text><line x1="450" y1="170" x2="450" y2="225" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="450" y="233" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2937" text-anchor="middle">H</text><line x1="450" y1="170" x2="545" y2="170" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="545" y="178" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#15803d" text-anchor="middle">Cl</text><circle cx="575" cy="143" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="588" cy="143" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="575" cy="165" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="588" cy="165" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="575" cy="187" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><circle cx="588" cy="187" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="450" y="275" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">14 valence electrons total</text><text x="450" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">4 C + 3 H + 7 Cl</text></svg>
