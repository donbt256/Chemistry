<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<title>Distance and electrostatic attraction</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Distance and electrostatic attraction</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">The inverse-square relationship is F ∝ 1/r²; the sketch is conceptual.</text><circle cx="220" cy="180" r="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="220" y="189.52" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">+</text><text x="220" y="235" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">nucleus</text><circle cx="350" cy="180" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="350" y="185.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">−</text><line x1="260" y1="180" x2="330" y2="180" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><text x="295" y="155" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">r</text><text x="470" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Closer electron</text><text x="470" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#15803d" text-anchor="middle">stronger attraction</text><circle cx="650" cy="180" r="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="650" y="189.52" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">+</text><circle cx="805" cy="180" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="805" y="185.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">−</text><line x1="690" y1="180" x2="785" y2="180" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><text x="738" y="155" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">2r</text><text x="730" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Twice the distance</text><text x="730" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#dc2626" text-anchor="middle">one-quarter the force</text></svg>
