<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590">
<title>Atomic radius: periodic trends</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Atomic radius: periodic trends</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">Schematic trend diagrams, not measured atom sizes.</text><text x="450" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Across a period</text><circle cx="280" cy="160" r="31" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="358" cy="160" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="436" cy="160" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="514" cy="160" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="592" cy="160" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><line x1="245" y1="215" x2="650" y2="215" stroke="#15803d" stroke-width="3" stroke-linecap="round"/><polygon points="650,215 634,207 634,223" fill="#15803d"/><text x="450" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">Atomic radius generally decreases →</text><text x="450" y="310" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Down a group</text><circle cx="355" cy="355" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="355" cy="410" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="355" cy="465" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="355" cy="520" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><line x1="430" y1="345" x2="430" y2="540" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><polygon points="430,540 422,524 438,524" fill="#7c3aed"/><text x="570" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Atomic radius generally</text><text x="570" y="465" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">increases ↓</text></svg>
