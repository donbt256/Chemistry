<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<title>Polar bonds, nonpolar molecule: CO₂</title><rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="450.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Polar bonds, nonpolar molecule: CO₂</text><text x="450.0" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">Linear geometry places the two C=O bond dipoles in opposite directions.</text><text x="240" y="150" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#2563eb" text-anchor="middle">O</text><text x="450" y="150" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">C</text><text x="660" y="150" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#2563eb" text-anchor="middle">O</text><line x1="285" y1="150" x2="405" y2="150" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="285" y1="158" x2="405" y2="158" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="495" y1="150" x2="615" y2="150" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="495" y1="158" x2="615" y2="158" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><line x1="355" y1="105" x2="405" y2="105" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="355,105 370,97 370,113" fill="#dc2626"/><line x1="545" y1="105" x2="495" y2="105" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="545,105 530,97 530,113" fill="#dc2626"/><text x="450" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">← bond dipole      bond dipole →</text><text x="450" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle">Equal and opposite bond dipoles cancel: net molecular dipole = 0</text></svg>
