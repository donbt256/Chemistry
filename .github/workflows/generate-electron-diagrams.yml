name: Generate Electron Diagram SVGs
# Runs whenever the diagram generator file is committed.
# Regenerates the diagrams whenever the generator changes.

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_electron_diagrams.py"
      - ".github/workflows/generate-electron-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Matplotlib
        run: python -m pip install --upgrade matplotlib numpy

      - name: Generate transparent SVGs
        run: python scripts/generate_electron_diagrams.py

      - name: Commit generated SVGs and remove old PNGs through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "main";
            const dir = "diagrams/electrons";

            const files = fs.readdirSync(dir)
              .filter(name => name.endsWith(".svg"))
              .sort();

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });

            const parentSha = ref.data.object.sha;

            const parentCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parentSha
            });

            const entries = [];
            const oldPngs = fs.readdirSync(dir).filter(name => name.endsWith(".png"));

            for (const name of oldPngs) {
              entries.push({ path: `${dir}/${name}`, mode: "100644", type: "blob", sha: null });
            }

            for (const name of files) {
              const filePath = path.join(dir, name);
              const content = fs.readFileSync(filePath).toString("base64");

              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content,
                encoding: "base64"
              });

              entries.push({
                path: filePath.replaceAll(path.sep, "/"),
                mode: "100644",
                type: "blob",
                sha: blob.data.sha
              });
            }

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.data.tree.sha,
              tree: entries
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "Generate theme-aware LaTeX electron diagrams",
              tree: tree.data.sha,
              parents: [parentSha]
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false
            });

            core.info(`Committed ${files.length} electron diagrams in ${commit.data.sha}`);
