name: Generate Electron Diagram PNGs

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_electron_diagrams.py"
      - ".github/workflows/generate-electron-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate transparent PNGs
        run: python scripts/generate_electron_diagrams.py

      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/electrons/*.png
          if git diff --cached --quiet; then
            echo "No diagram changes."
            exit 0
          fi
          git commit -m "Generate readable transparent electron diagrams"
          git push
