name: Generate covalent bonding diagrams

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_covalent_diagrams.py"
      - ".github/workflows/generate-covalent-diagrams.yml"
      - "Unit03-Covalent-Bonding.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate vector diagrams
        run: python scripts/generate_covalent_diagrams.py
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/covalent/*.svg
          if git diff --cached --quiet; then
            echo "Generated diagrams are already up to date."
          else
            git commit -m "Generate covalent bonding SVG diagrams"
            git push
          fi
